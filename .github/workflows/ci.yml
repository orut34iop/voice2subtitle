name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check build identity and project registration
        run: |
          python3 scripts/build-metadata.py
          python3 scripts/verify-project.py
          python3 -m unittest discover -s Tests/BuildTools
          bash -n scripts/build.sh scripts/test.sh scripts/release.sh
      - name: Test the Xcode app target
        run: scripts/test.sh
      - name: Test the Swift package
        run: scripts/test.sh --swiftpm
      - name: Build the arm64 release app
        run: scripts/build.sh Release
      - name: Verify release artifact
        run: |
          python3 scripts/build-metadata.py
          codesign --verify --deep --strict .build/app/Build/Products/Release/v2s.app
          test "$(lipo -archs .build/app/Build/Products/Release/v2s.app/Contents/MacOS/v2s)" = arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-test-results
          path: .build/app/Logs/Test/*.xcresult
          if-no-files-found: ignore
