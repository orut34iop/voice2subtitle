name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify release version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/build-metadata.py --version "${RELEASE_TAG#v}"
          python3 scripts/verify-project.py
          python3 -m unittest discover -s Tests/BuildTools

      - name: Run regression tests
        run: scripts/test.sh

      - name: Build release app with current build time
        run: scripts/build.sh Release

      - name: Package app
        run: |
          APP_PATH=".build/app/Build/Products/Release/v2s.app"
          python3 scripts/build-metadata.py --version "${RELEASE_TAG#v}"
          codesign --verify --deep --strict "$APP_PATH"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/v2s")" = arm64
          mkdir -p dist
          ZIP_NAME="v2s-${RELEASE_TAG#v}.app.zip"
          ditto -c -k --keepParent "$APP_PATH" "dist/$ZIP_NAME"
          (cd dist && shasum -a 256 "$ZIP_NAME" > "v2s-${RELEASE_TAG#v}.sha256")

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SPARKLE_TOOL="$(find .build/app -name generate_appcast -type f -print -quit)"
          test -n "$SPARKLE_TOOL"
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          curl -fsSL "https://github.com/$REPOSITORY/releases/latest/download/appcast.xml" \
            -o dist/appcast.xml 2>/dev/null || true
          "$SPARKLE_TOOL" --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/$REPOSITORY" dist/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/v2s-${RELEASE_TAG#v}.app.zip" \
              "dist/v2s-${RELEASE_TAG#v}.sha256" dist/appcast.xml --clobber
          else
            gh release create "$RELEASE_TAG" "dist/v2s-${RELEASE_TAG#v}.app.zip" \
              "dist/v2s-${RELEASE_TAG#v}.sha256" dist/appcast.xml \
              --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi
